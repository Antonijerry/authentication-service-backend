spring:
  application:
    name: auth-app-backend

  profiles:
    default: dev

  jpa:
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER:auth-app-backend}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}